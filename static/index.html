<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер Задач</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .form-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .form-card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }
        
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-danger {
            background: #dc3545;
        }
        
        .btn-success {
            background: #28a745;
        }
        
        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .filter-section .form-group {
            margin-bottom: 0;
        }
        
        .task-list {
            display: grid;
            gap: 15px;
        }
        
        .task-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            position: relative;
        }
        
        .task-card:hover {
            transform: translateX(5px);
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .task-title {
            font-size: 1.2rem;
            color: #333;
            font-weight: 600;
        }
        
        .task-id {
            font-size: 0.85rem;
            color: #999;
        }
        
        .task-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        
        .task-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .badge-status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-status-in_progress {
            background: #cce5ff;
            color: #004085;
        }
        
        .badge-status-done {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-priority-low {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-priority-medium {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-priority-high {
            background: #f8d7da;
            color: #721c24;
        }
        
        .task-actions {
            display: flex;
            gap: 10px;
        }
        
        .task-actions button {
            padding: 8px 15px;
            font-size: 14px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: white;
        }
        
        .empty-state p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            padding: 0;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: white;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Менеджер Задач</h1>
        
        <!-- Форма создания задачи -->
        <div class="form-card">
            <h2>➕ Новая задача</h2>
            <div id="createFormError" class="error-message"></div>
            <div id="createFormSuccess" class="success-message"></div>
            <form id="createForm">
                <div class="form-group">
                    <label for="title">Название *</label>
                    <input type="text" id="title" name="title" required placeholder="Введите название задачи">
                </div>
                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" name="description" placeholder="Опишите задачу подробно"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="status">Статус</label>
                        <select id="status" name="status">
                            <option value="pending">Ожидает</option>
                            <option value="in_progress">В работе</option>
                            <option value="done">Завершено</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="priority">Приоритет</label>
                        <select id="priority" name="priority">
                            <option value="low">Низкий</option>
                            <option value="medium">Средний</option>
                            <option value="high">Высокий</option>
                        </select>
                    </div>
                </div>
                <button type="submit">Создать задачу</button>
            </form>
        </div>
        
        <!-- Фильтры и список задач -->
        <div class="form-card">
            <h2>📝 Список задач</h2>
            <div class="filter-section">
                <div class="form-group">
                    <label for="filterStatus">Фильтр по статусу</label>
                    <select id="filterStatus">
                        <option value="">Все</option>
                        <option value="pending">Ожидает</option>
                        <option value="in_progress">В работе</option>
                        <option value="done">Завершено</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button onclick="loadTasks()">Применить</button>
                </div>
                <div class="form-group">
                    <label>&nbsp;</label>
                    <button class="btn-secondary" onclick="clearFilter()">Сбросить</button>
                </div>
            </div>
            <div id="taskList" class="task-list"></div>
        </div>
    </div>
    
    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ Редактировать задачу</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div id="editFormError" class="error-message"></div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label for="editTitle">Название *</label>
                    <input type="text" id="editTitle" required>
                </div>
                <div class="form-group">
                    <label for="editDescription">Описание</label>
                    <textarea id="editDescription"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editStatus">Статус</label>
                        <select id="editStatus">
                            <option value="pending">Ожидает</option>
                            <option value="in_progress">В работе</option>
                            <option value="done">Завершено</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editPriority">Приоритет</label>
                        <select id="editPriority">
                            <option value="low">Низкий</option>
                            <option value="medium">Средний</option>
                            <option value="high">Высокий</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-success">Сохранить</button>
                <button type="button" class="btn-secondary" onclick="closeModal()">Отмена</button>
            </form>
        </div>
    </div>
    
    <script>
        const API_BASE = '';
        
        // Загрузка задач
        async function loadTasks() {
            const taskList = document.getElementById('taskList');
            const status = document.getElementById('filterStatus').value;
            
            taskList.innerHTML = '<div class="loading">Загрузка...</div>';
            
            try {
                let url = `${API_BASE}/tasks`;
                if (status) {
                    url += `?status=${status}`;
                }
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Ошибка загрузки');
                
                const tasks = await response.json();
                
                if (tasks.length === 0) {
                    taskList.innerHTML = '<div class="empty-state"><p>Нет задач для отображения</p></div>';
                    return;
                }
                
                taskList.innerHTML = tasks.map(task => `
                    <div class="task-card">
                        <div class="task-header">
                            <span class="task-title">${escapeHtml(task.title)}</span>
                            <span class="task-id">#${task.id}</span>
                        </div>
                        ${task.description ? `<p class="task-description">${escapeHtml(task.description)}</p>` : ''}
                        <div class="task-meta">
                            <span class="badge badge-status-${task.status}">${getStatusText(task.status)}</span>
                            <span class="badge badge-priority-${task.priority}">${getPriorityText(task.priority)}</span>
                        </div>
                        <div class="task-actions">
                            <button onclick="openEditModal(${task.id})">Редактировать</button>
                            <button class="btn-danger" onclick="deleteTask(${task.id})">Удалить</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                taskList.innerHTML = `<div class="empty-state"><p>Ошибка: ${error.message}</p></div>`;
            }
        }
        
        // Создание задачи
        document.getElementById('createForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorDiv = document.getElementById('createFormError');
            const successDiv = document.getElementById('createFormSuccess');
            
            const task = {
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim(),
                status: document.getElementById('status').value,
                priority: document.getElementById('priority').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка создания');
                }
                
                successDiv.textContent = 'Задача успешно создана!';
                successDiv.style.display = 'block';
                errorDiv.style.display = 'none';
                
                document.getElementById('createForm').reset();
                loadTasks();
                
                setTimeout(() => successDiv.style.display = 'none', 3000);
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                successDiv.style.display = 'none';
            }
        });
        
        // Удаление задачи
        async function deleteTask(id) {
            if (!confirm('Вы уверены, что хотите удалить эту задачу?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/tasks/${id}`, {
                    method: 'DELETE'
                });
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.error || 'Ошибка удаления');
                }
                
                loadTasks();
            } catch (error) {
                alert(`Ошибка: ${error.message}`);
            }
        }
        
        // Открытие модального окна редактирования
        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${id}`);
                if (!response.ok) throw new Error('Ошибка загрузки');
                
                const task = await response.json();
                
                document.getElementById('editId').value = task.id;
                document.getElementById('editTitle').value = task.title;
                document.getElementById('editDescription').value = task.description || '';
                document.getElementById('editStatus').value = task.status;
                document.getElementById('editPriority').value = task.priority;
                
                document.getElementById('editModal').classList.add('active');
                document.getElementById('editFormError').style.display = 'none';
            } catch (error) {
                alert(`Ошибка: ${error.message}`);
            }
        }
        
        // Закрытие модального окна
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }
        
        // Сохранение изменений
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorDiv = document.getElementById('editFormError');
            const id = document.getElementById('editId').value;
            
            const task = {
                title: document.getElementById('editTitle').value.trim(),
                description: document.getElementById('editDescription').value.trim(),
                status: document.getElementById('editStatus').value,
                priority: document.getElementById('editPriority').value
            };
            
            try {
                const response = await fetch(`${API_BASE}/tasks/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка обновления');
                }
                
                closeModal();
                loadTasks();
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
            }
        });
        
        // Очистка фильтра
        function clearFilter() {
            document.getElementById('filterStatus').value = '';
            loadTasks();
        }
        
        // Вспомогательные функции
        function getStatusText(status) {
            const map = {
                'pending': 'Ожидает',
                'in_progress': 'В работе',
                'done': 'Завершено'
            };
            return map[status] || status;
        }
        
        function getPriorityText(priority) {
            const map = {
                'low': 'Низкий',
                'medium': 'Средний',
                'high': 'Высокий'
            };
            return map[priority] || priority;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Закрытие модального окна по клику вне его
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeModal();
        });
        
        // Загрузка задач при старте
        loadTasks();
    </script>
</body>
</html>
